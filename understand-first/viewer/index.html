<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>Understand First</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #f6f6f3;
    --panel: #ffffff;
    --fg: #1d2127;
    --muted: #5b6470;
    --line: #dcdfe3;
    --accent: #2457c5;
    --accent-fg: #ffffff;
    --new: #5b6470;
    --learning: #9a5b00;
    --getting-it: #1f5fa8;
    --solid: #1a7a3f;
    --danger: #b3261e;
    --page-w: 1360px;
    --code-bg: #f1f3f8; --code-fg: #232a3b; --code-line: #dde1ea; --code-muted: #5d667a; --code-path: #1d4fb8; --code-sym: #0b7a75;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171b; --panel: #1c2026; --fg: #e8eaed; --muted: #9aa3ae; --line: #2d333b;
      --accent: #7aa2f7; --accent-fg: #101319; --new: #9aa3ae; --learning: #f0b24a;
      --getting-it: #7cb8f2; --solid: #5fcf8a; --danger: #ff8a80; color-scheme: dark;
      --code-bg: #0d1017; --code-fg: #d6dbe8; --code-line: #262c3a; --code-muted: #8d97ad; --code-path: #86a8ff; --code-sym: #6fd3c8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171b; --panel: #1c2026; --fg: #e8eaed; --muted: #9aa3ae; --line: #2d333b;
    --accent: #7aa2f7; --accent-fg: #101319; --new: #9aa3ae; --learning: #f0b24a;
    --getting-it: #7cb8f2; --solid: #5fcf8a; --danger: #ff8a80; color-scheme: dark;
    --code-bg: #0d1017; --code-fg: #d6dbe8; --code-line: #262c3a; --code-muted: #8d97ad; --code-path: #86a8ff; --code-sym: #6fd3c8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 24px; padding: 14px max(16px, env(safe-area-inset-left), calc((100% - var(--page-w)) / 2)); border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; letter-spacing: 0.01em; }
  nav { display: flex; gap: 4px; }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; }
  nav a[aria-current="page"] { color: var(--fg); background: var(--bg); font-weight: 600; }
  .live { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--solid); }
  .dot.off { background: var(--danger); }
  main { max-width: var(--page-w); margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left)) 48px; display: grid; gap: 16px; }
  section[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; }
  .big { font-size: 26px; font-weight: 650; }
  .muted { color: var(--muted); }
  .steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .step { height: 8px; border-radius: 4px; background: var(--line); }
  .step.done { background: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid currentColor; border-radius: 999px; padding: 1px 10px; font-size: 13px; white-space: nowrap; background: transparent; color: var(--fg); cursor: pointer; }
  .chip.new { color: var(--new); } .chip.learning { color: var(--learning); }
  .chip.getting-it { color: var(--getting-it); } .chip.solid { color: var(--solid); }
  .chip:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
  .chip.static { cursor: default; }
  .chip.static:hover { background: transparent; }
  .chip.bad { color: var(--danger); }
  .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .group .label { color: var(--muted); font-size: 13px; min-width: 7.5em; }
  input[type="search"] { width: 100%; padding: 8px 12px; }
  mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
  .work { gap: 8px; }
  .work h3 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
  .work .field { overflow-wrap: anywhere; }
  .work summary { display: grid; gap: 8px; cursor: pointer; list-style: none; }
  .work summary::-webkit-details-marker { display: none; }
  .work summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  .work summary .title { margin: 0; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .work summary .title::before { content: "\25B8"; display: inline-block; width: 1.2em; color: var(--muted); }
  .work details[open] > summary .title::before { content: "\25BE"; }
  .work .body { display: grid; gap: 8px; margin-top: 8px; }
  .work .example { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .work-concept { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .work-concept .name { font-weight: 600; overflow-wrap: anywhere; }
  .work-concept .detail { grid-column: 1 / -1; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .results { display: grid; gap: 16px; }
  .tabs { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); justify-self: start; }
  .tab { border: 0; border-radius: 6px; padding: 5px 14px; background: transparent; color: var(--muted); }
  .tab.active { background: var(--panel); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / 0.14); }
  .rungs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; list-style: none; margin: 0; padding: 0; }
  .rungs li { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .rungs .bar { height: 8px; border-radius: 4px; background: var(--line); }
  .rungs li.done .bar { background: var(--accent); }
  .rungs li.current { color: var(--fg); font-weight: 600; }
  .row .detail.none { font-style: italic; }
  .chip.active { font-weight: 650; box-shadow: inset 0 0 0 1px currentColor; background: color-mix(in srgb, currentColor 16%, transparent); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .name { font-weight: 600; overflow-wrap: anywhere; }
  .row .language-examples { grid-column: 1 / -1; display: grid; gap: 8px; margin-top: 4px; }
  .row .detail { grid-column: 1 / -1; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .concept-row { padding: 10px 0; border-top: 1px solid var(--line); }
  .concept-row:first-of-type { border-top: 0; }
  .concept-row summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; cursor: pointer; list-style: none; }
  .concept-row summary::-webkit-details-marker { display: none; }
  .concept-row summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  .concept-row summary .name { font-weight: 600; overflow-wrap: anywhere; }
  .concept-row summary .name::before { content: "\25B8"; display: inline-block; width: 1.2em; color: var(--muted); }
  .concept-row details[open] > summary .name::before { content: "\25BE"; }
  .concept-row summary .detail { grid-column: 1 / -1; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .concept-row .body { display: grid; gap: 8px; margin-top: 8px; }
  .concept-row .field { overflow-wrap: anywhere; }
  .concept-row .example { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .event { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 4px 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .event:first-of-type { border-top: 0; }
  .event .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  .event .what { overflow-wrap: anywhere; }
  .event .what b { font-weight: 600; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 0; }
  #toast { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; max-width: calc(100vw - 32px); }
  #toast[hidden] { display: none; }
  #stats:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px 24px; align-items: start; }
  #stats > .summary { grid-column: 1 / -1; }
  #recent:not([hidden]) { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px 24px; align-items: start; }
  #recent > .card:first-child { position: sticky; top: 16px; }
  #languages:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px 24px; align-items: start; }
  #languages > :nth-child(-n+2) { grid-column: 1 / -1; }
  #settings:not([hidden]) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; align-items: start; }
  #projects:not([hidden]) { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .card.danger-zone { border-color: var(--danger); }
  .card.danger-zone > h2 { color: var(--danger); }
  .summary { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); align-items: center; gap: 16px 28px; }
  .summary .last { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; }
  .counts { display: flex; flex-wrap: wrap; gap: 8px; }
  .count { flex: 1; min-width: 6.5em; display: grid; justify-items: start; padding: 10px 12px; border: 1px solid transparent; border-radius: 8px; background: color-mix(in srgb, currentColor 12%, transparent); font-size: 13px; }
  .count b { font-size: 24px; line-height: 1.15; font-weight: 650; }
  .count.new { color: var(--new); } .count.learning { color: var(--learning); }
  .count.getting-it { color: var(--getting-it); } .count.solid { color: var(--solid); }
  .count.active { border-color: currentColor; }
  .fold { border-top: 1px solid var(--line); }
  .fold:first-of-type { border-top: 0; }
  .fold > summary { display: flex; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; list-style: none; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before { content: "\25B8"; color: var(--muted); width: 1.2em; }
  .fold[open] > summary::before { content: "\25BE"; }
  .concept-row summary .meta { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tag { margin-left: 8px; font-size: 12px; font-weight: 500; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; }
  .example-item { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .example-item summary { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; cursor: pointer; list-style: none; }
  .example-item summary::-webkit-details-marker { display: none; }
  .example-item summary::before { content: "\25B8"; color: var(--muted); }
  .example-item details[open] > summary::before { content: "\25BE"; }
  .example-item details[open] > summary { border-bottom: 1px solid var(--line); }
  .example-item summary:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .exn { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .ext { font-weight: 600; overflow-wrap: anywhere; }
  .exbody { display: grid; gap: 12px; padding: 12px; }
  .example-detail { padding-left: 0; overflow-wrap: anywhere; }
  .code { border: 1px solid var(--code-line); border-radius: 8px; background: var(--code-bg); overflow: hidden; }
  .code-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 6px 5px 12px; font-size: 12px; color: var(--code-muted); border-bottom: 1px solid var(--code-line); }
  .code pre { margin: 0; padding: 10px 12px; font: 12.5px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--code-fg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .code-lines { padding: 8px 0; font: 12.5px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--code-fg); overflow-x: auto; }
  .code-line { display: grid; grid-template-columns: 3.5em 1fr; }
  .code-line .ln { text-align: right; padding-right: 1em; color: var(--code-muted); user-select: none; }
  .code-line .ct { white-space: pre; padding-right: 12px; }
  .code-line.hl { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
  #docs:not([hidden]) { display: grid; gap: 16px; max-width: 780px; margin: 0 auto; width: 100%; }
  #docs h2 { font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--fg); }
  #docs ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  #docs code { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--code-line); border-radius: 5px; padding: 1px 6px; }
  .code-caption { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .code .p { color: var(--code-path); }
  .code .s { color: var(--code-sym); }
  .code button.copy { border-color: var(--code-line); background: transparent; color: var(--code-muted); border-radius: 6px; padding: 2px 9px; font-size: 12px; }
  .project-column { display: grid; gap: 10px; position: sticky; top: 16px; max-height: calc(100vh - 32px); grid-template-rows: auto auto minmax(0, 1fr); }
  .project-list { overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .project-item { display: grid; gap: 5px; width: 100%; text-align: left; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; }
  .project-item:last-child { border-bottom: 0; }
  .project-item:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .project-item[aria-current="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
  .project-item .title { font-weight: 600; overflow-wrap: anywhere; }
  .project-item .refs, .ref { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
  .ref { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 1px 8px; }
  .project-detail { display: grid; gap: 16px; min-width: 0; }
  .project-detail h1 { margin: 0; font-size: 21px; line-height: 1.25; overflow-wrap: anywhere; }
  .project-detail h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .project-detail p { margin: 0; max-width: 70ch; overflow-wrap: anywhere; }
  .two-up { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .skill-row { display: grid; grid-template-columns: minmax(0, 190px) 150px minmax(0, 1fr); gap: 4px 14px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .skill-row:first-of-type { border-top: 0; }
  .level { display: inline-flex; align-items: center; gap: 8px; }
  .meter { display: inline-flex; gap: 3px; }
  .meter i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); display: block; }
  .meter i.on.learning { background: var(--learning); } .meter i.on.getting-it { background: var(--getting-it); } .meter i.on.solid { background: var(--solid); }
  .not-recorded { color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  @media (max-width: 960px) {
    #stats:not([hidden]), #recent:not([hidden]), #languages:not([hidden]), #settings:not([hidden]), #projects:not([hidden]) { grid-template-columns: 1fr; }
    #recent > .card:first-child, .project-column { position: static; max-height: none; }
    .project-list { max-height: 320px; }
    .two-up, .skill-row { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) { .event { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Understand first</h1>
  <nav>
    <a href="#stats" id="nav-stats">Stats</a>
    <a href="#recent" id="nav-recent">Recent</a>
    <a href="#projects" id="nav-projects">Projects</a>
    <a href="#languages" id="nav-languages">Languages</a>
    <a href="#settings" id="nav-settings">Settings</a>
    <a href="#docs" id="nav-docs">Docs</a>
  </nav>
  <div class="live"><span class="dot" id="dot"></span><span id="live-text">connecting</span></div>
</header>
<main>
  <section id="stats" aria-label="Stats" hidden></section>
  <section id="recent" aria-label="Recent" hidden></section>
  <section id="projects" aria-label="Projects" hidden></section>
  <section id="languages" aria-label="Languages" hidden></section>
  <section id="settings" aria-label="Settings" hidden></section>
  <section id="docs" aria-label="Docs" hidden></section>
</main>
<div id="toast" role="status" hidden></div>
<script>
(function () {
  var TOKEN = document.querySelector('meta[name="token"]').content;
  var POLL_MS = 2000;
  var RUNGS = 4;
  var FILTER_KEY = 'understand-first-status-filter';
  var LANGUAGE_KEY = 'understand-first-language';
  var SCREENS = ['stats', 'recent', 'projects', 'languages', 'settings', 'docs'];
  var DOCS = [
    { title: 'Things you can say', points: [
      ['"I don\'t know"', 'Claude teaches it, you say it back. Never a failure.'],
      ['"skip the gates"', 'Override mode: Claude does the task without gates. It is logged as skipped.'],
      ['"go back a stage"', 'Slow the process down. Moving up happens on its own.'],
      ['"help me understand this PR"', 'A walkthrough of a PR, commit, file or function. Same for "walk me through this".'],
      ['"review this PR"', 'A review that keeps you in the loop.'],
      ['"teach me something"', 'Study mode, no work and no gates.'],
      ['"do this part for me"', 'Claude asks "are you sure?" and "why?", then does it and logs it as delegated.']
    ] },
    { title: 'Stages', points: [
      ['Stage 1', 'You state the problem in your own words before Claude proposes anything.'],
      ['Stage 2', 'You explain the change back before it is committed. The code dial starts.'],
      ['Stage 3', 'You pick and retell the design, predict test results, and fix review findings first.'],
      ['Stage 4', 'Skeptical-architect questions at teach-back.'],
      ['Stage 5', 'For work you build, a pseudocode outline of the whole change in your own words.'],
      ['Stage 6', 'A retro at the end of each task. The full process.']
    ] },
    { title: 'Slash commands', points: [
      ['/understand-first:menu', 'Your stats.'],
      ['/understand-first:menu settings', 'Settings.'],
      ['/understand-first:menu recent [words]', 'Recent work, optionally searched.'],
      ['/understand-first:menu skip', 'Skip the gates for the next task.'],
      ['/understand-first:menu stage <n>', 'Go back to stage n.'],
      ['/understand-first:menu reset', 'Back to stage 1. Your concepts stay.'],
      ['/understand-first:menu language <name>', 'Set your main language.'],
      ['/understand-first:menu add <language>', 'Add a language to the code dial.'],
      ['/understand-first:menu dial <language>', 'Lower that language\'s dial by one rung.'],
      ['/understand-first:menu viewer on|off|open|stop|status', 'Control this viewer.'],
      ['/understand-first:learn [topic]', 'Study mode on a topic.']
    ] }
  ];
  var STATUS_ORDER = ['learning', 'getting it', 'solid', 'new'];
  var EVENT_LABELS = {
    'delegated': 'Delegated', 'dont-know': 'Said "I don\'t know"', 'gate-passed': 'Gate passed', 'gate-retry': 'Gate retry',
    'phase-end': 'Phase ended', 'phase-start': 'Phase started', 'recall': 'Recall', 'setting-changed': 'Setting changed',
    'study-check': 'Study check', 'study-end': 'Study ended', 'study-start': 'Study started', 'teach-back': 'Teach-back',
    'walkthrough-end': 'Walkthrough ended', 'walkthrough-start': 'Walkthrough started'
  };
  var DAYS_SHOWN = 2;
  var openGroups = {};
  var openDays = {};
  var showOlderDays = false;
  var UNDERSTANDING_LEVELS = ['understood', 'partly', 'not yet', 'skipped', 'not assessed'];
  var WORK_KINDS = ['built', 'walked through', 'reviewed'];
  var UNDERSTANDING_TONES = { 'understood': 'solid', 'partly': 'learning', 'not yet': 'bad', 'skipped': 'learning' };
  var EXAMPLE_LABELS = { 'what': 'What it is', 'where': 'Where in the code' };
  var CODE_REFERENCE =/([\w.-]+(?:\/[\w.-]+)+\.\w+|\b[A-Za-z_]\w*::\w+)/;
  var recentQuery = '';
  var understandingFilter = '';
  var kindFilter = '';
  var EVENT_MATCHES_SHOWN = 50;
  var openKeys = {};
  var queryThatOpenedCards = '';
  var recentParts = null;
  var shownRecent = '';
  var projectQuery = '';
  var projectUnderstanding = '';
  var projectKind = '';
  var selectedProjectKey = '';
  var projectParts = null;
  var shownProjects = '';
  var RUNG_NAMES = ['one line', 'one test assertion', 'one whole test', 'one whole function'];
  var state = null;
  var shownStats = '';
  var shownLanguages = '';
  var shownSettings = '';
  var statusFilter = savedStatusFilter();
  var selectedLanguage = savedLanguage();

  function savedLanguage() {
    try { return localStorage.getItem(LANGUAGE_KEY) || ''; } catch { return ''; }
  }

  function setSelectedLanguage(name) {
    selectedLanguage = name;
    try { localStorage.setItem(LANGUAGE_KEY, name); } catch { selectedLanguage = name; }
    render(true);
  }

  function activeLanguage() {
    var names = state.dial.map(function (entry) { return entry.language; });
    if (names.indexOf(selectedLanguage) !== -1) return selectedLanguage;
    return names.indexOf(state.language) !== -1 ? state.language : (names[0] || '');
  }

  function savedStatusFilter() {
    try { return localStorage.getItem(FILTER_KEY) || ''; } catch { return ''; }
  }

  function setStatusFilter(status) {
    statusFilter = status;
    try { localStorage.setItem(FILTER_KEY, status); } catch { statusFilter = status; }
    render(true);
  }

  function el(tag, attributes) {
    var node = document.createElement(tag);
    Object.keys(attributes || {}).forEach(function (key) {
      var value = attributes[key];
      if (value === null || value === undefined) return;
      if (key === 'text') node.textContent = value;
      else if (key === 'class') node.className = value;
      else if (key.indexOf('on') === 0) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    });
    appendChildren(node, Array.prototype.slice.call(arguments, 2));
    return node;
  }

  function appendChildren(node, children) {
    children.forEach(function (child) {
      if (child === null || child === undefined || child === false) return;
      if (Array.isArray(child)) appendChildren(node, child);
      else node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    });
  }

  function replaceChildren(parent, children) {
    while (parent.firstChild) parent.removeChild(parent.firstChild);
    appendChildren(parent, children);
  }

  function currentScreen() {
    var name = location.hash.slice(1);
    return SCREENS.indexOf(name) === -1 ? 'stats' : name;
  }

  function showScreen() {
    var screen = currentScreen();
    SCREENS.forEach(function (name) { document.getElementById(name).hidden = name !== screen; });
    SCREENS.forEach(function (name) {
      var link = document.getElementById('nav-' + name);
      if (name === screen) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
  }

  function showToast(message) {
    var toast = document.getElementById('toast');
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function () { toast.hidden = true; }, 4000);
  }

  function setConnection(isLive) {
    document.getElementById('dot').className = isLive ? 'dot' : 'dot off';
    document.getElementById('live-text').textContent = isLive ? 'live' : 'offline';
  }

  function post(body) {
    return fetch('/api/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN },
      body: JSON.stringify(body)
    }).then(function (response) { return response.json(); }).then(function (result) {
      showToast(result.message);
      if (result.state) { state = result.state; render(true); }
    }).catch(function () { showToast('Could not reach the viewer.'); });
  }

  function countTile(status, total) {
    var isActive = statusFilter === status;
    return el('button', {
      type: 'button',
      'class': 'count ' + statusClass(status) + (isActive ? ' active' : ''),
      'aria-pressed': isActive ? 'true' : 'false',
      title: isActive ? 'Show all concepts' : 'Show only ' + status + ' concepts',
      onclick: function () { setStatusFilter(isActive ? '' : status); }
    }, el('b', { text: String(total) }), ' ' + status);
  }

  function statusClass(status) {
    return status.replace(/ /g, '-');
  }

  function showAllChip() {
    return el('button', { type: 'button', 'class': 'chip', onclick: function () { setStatusFilter(''); }, text: 'Show all' });
  }

  function hasStatus(concept) {
    return !statusFilter || (concept.status || 'new') === statusFilter;
  }

  function countByStatus(concepts) {
    var counts = { 'new': 0, 'learning': 0, 'getting it': 0, 'solid': 0 };
    concepts.forEach(function (concept) { counts[concept.status || 'new'] = (counts[concept.status || 'new'] || 0) + 1; });
    return counts;
  }

  function newestFirst(events) {
    return events.slice().sort(function (a, b) { return (b.date + ' ' + b.time).localeCompare(a.date + ' ' + a.time); });
  }

  function eventTitle(event) {
    return (EVENT_LABELS[event.event] || event.event || '') + (event.concept ? ' ' + event.concept : '');
  }

  function summaryCard() {
    var counts = countByStatus(state.concepts);
    var steps = [];
    for (var i = 1; i <= state.stageCount; i++) steps.push(el('div', { 'class': i <= state.stage ? 'step done' : 'step' }));
    var tiles = STATUS_ORDER
      .filter(function (status) { return status !== 'new' || counts[status] > 0 || statusFilter === 'new'; })
      .map(function (status) { return countTile(status, counts[status]); });
    var latest = newestFirst(state.events)[0];
    return el('div', { 'class': 'card summary' },
      el('div', { 'class': 'stage' },
        el('h2', { text: 'Stage' }),
        el('div', { 'class': 'big', text: 'Stage ' + state.stage + ' of ' + state.stageCount }),
        el('div', { 'class': 'steps' }, steps),
        el('div', { 'class': 'muted', text: 'since ' + (state.stageSince || 'unknown') + ' · stats ' + state.statsMode })),
      el('div', { 'class': 'counts' }, tiles),
      latest ? el('div', { 'class': 'muted last', text: 'Last activity ' + (latest.date || '').slice(5) + ' ' + (latest.time || '') + ' · ' + eventTitle(latest) }) : null
    );
  }

  function conceptRow(concept) {
    var meta = [concept.examples + ' example' + (concept.examples === 1 ? '' : 's'), concept.verified ? 'verified ' + concept.verified : ''].filter(Boolean).join(' · ');
    var summary = [
      el('div', { 'class': 'name' }, concept.name, concept.study ? el('span', { 'class': 'tag', text: 'studied' }) : null),
      el('div', { 'class': 'meta', text: meta })
    ];
    return el('div', { 'class': 'concept-row', role: 'listitem' }, disclosure(conceptKey(concept), summary, el('div', { 'class': 'body' }, conceptFields(concept, []))));
  }

  function fold(openStore, key, isOpenByDefault, summaryContent, body) {
    var details = el('details', { 'class': 'fold' },
      el('summary', { onclick: function () { openStore[key] = !details.open; } }, summaryContent),
      body
    );
    details.open = openStore[key] !== undefined ? openStore[key] : isOpenByDefault;
    return details;
  }

  function conceptGroup(status, concepts) {
    if (!concepts.length) return null;
    return fold(openGroups, status, status === 'learning' || statusFilter !== '',
      [el('span', { 'class': 'chip static ' + statusClass(status), text: status }), el('span', { 'class': 'muted', text: String(concepts.length) })],
      el('div', { role: 'list', 'aria-label': status + ' concepts' }, concepts.map(conceptRow))
    );
  }

  function conceptsCard() {
    var visible = state.concepts.filter(hasStatus);
    var groups = STATUS_ORDER.map(function (status) {
      return conceptGroup(status, visible.filter(function (concept) { return (concept.status || 'new') === status; }));
    });
    var heading = statusFilter ? visible.length + ' ' + statusFilter + ' of ' + state.concepts.length : String(state.concepts.length);
    var emptyText = statusFilter ? 'No ' + statusFilter + ' concepts.' : 'None yet.';
    return el('div', { 'class': 'card' },
      el('h2', { text: 'Concepts (' + heading + ')' }),
      statusFilter ? el('div', { 'class': 'chips' }, showAllChip()) : null,
      visible.length ? groups : el('div', { 'class': 'muted', text: emptyText })
    );
  }

  function eventDetail(event) {
    return event.concept || event.note || '';
  }

  function eventsByDay(events) {
    var days = [];
    events.forEach(function (event) {
      var day = days[days.length - 1];
      if (!day || day.date !== event.date) {
        day = { date: event.date, events: [] };
        days.push(day);
      }
      day.events.push(event);
    });
    return days;
  }

  function repeatedStudyChecksFolded(events) {
    var runs = [];
    events.forEach(function (event) {
      var run = runs[runs.length - 1];
      var continuesRun = run && event.event === 'study-check' && run[0].event === 'study-check' && run[0].concept === event.concept;
      if (continuesRun) run.push(event);
      else runs.push([event]);
    });
    return runs;
  }

  function eventRow(run) {
    var event = run[0];
    var detail = eventDetail(event);
    var repeats = run.length > 1 ? ' ×' + run.length : '';
    return el('div', { 'class': 'event', role: 'listitem' },
      el('div', { 'class': 'when', text: event.time || '' }),
      el('div', { 'class': 'what' }, el('b', { text: (EVENT_LABELS[event.event] || event.event || '') + repeats }), detail ? ' · ' + detail : '')
    );
  }

  function dayFold(day, isNewest) {
    return fold(openDays, day.date, isNewest,
      [el('b', { text: day.date }), el('span', { 'class': 'muted', text: day.events.length + (day.events.length === 1 ? ' event' : ' events') })],
      el('div', { role: 'list', 'aria-label': 'Activity on ' + day.date }, repeatedStudyChecksFolded(day.events).map(eventRow))
    );
  }

  function eventsCard() {
    var coreEvents = newestFirst(state.events.filter(function (event) { return !event.language; }));
    var days = eventsByDay(coreEvents);
    var shownDays = showOlderDays ? days : days.slice(0, DAYS_SHOWN);
    var olderCount = days.slice(DAYS_SHOWN).reduce(function (total, day) { return total + day.events.length; }, 0);
    return el('div', { 'class': 'card' },
      el('h2', { text: 'Recent activity (' + coreEvents.length + ')' }),
      shownDays.length ? shownDays.map(function (day, index) { return dayFold(day, index === 0); }) : el('div', { 'class': 'muted', text: 'No events yet.' }),
      !showOlderDays && olderCount ? el('button', { type: 'button', onclick: function () { showOlderDays = true; render(true); } }, 'Show older (' + olderCount + ' events)') : null,
      coreEvents.length < state.events.length ? el('div', { 'class': 'muted', text: 'Events about a language are on the Languages screen.' }) : null
    );
  }

  function renderStats() {
    var key = JSON.stringify([state, statusFilter]);
    if (key === shownStats) return;
    shownStats = key;
    var root = document.getElementById('stats');
    if (!state.hasLedger) {
      replaceChildren(root, [el('div', { 'class': 'card' }, el('div', { text: 'No ledger yet. The first understand-first session creates it.' }))]);
      return;
    }
    replaceChildren(root, [summaryCard(), conceptsCard(), eventsCard()]);
  }

  function escapeRegExp(value) {
    return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function queryTokens() {
    return recentQuery.toLowerCase().split(/\s+/).filter(Boolean);
  }

  function marked(text, tokens) {
    if (!text || !tokens.length) return [text || ''];
    var pattern = new RegExp('(' + tokens.map(escapeRegExp).join('|') + ')', 'gi');
    return text.split(pattern).map(function (piece, index) {
      return index % 2 === 1 ? el('mark', { text: piece }) : piece;
    });
  }

  function conceptStatusByName() {
    var statuses = {};
    state.concepts.forEach(function (concept) { statuses[concept.name.toLowerCase()] = concept.status || 'new'; });
    return statuses;
  }

  function liveStatus(statuses, name) {
    return statuses[name.toLowerCase()] || 'not in ledger';
  }

  function containsEveryToken(text, tokens) {
    var haystack = text.toLowerCase();
    return tokens.every(function (token) { return haystack.indexOf(token) !== -1; });
  }

  function workSearchText(item, statuses) {
    var parts = [item.title, item.kind, item.understanding, item.date, item.source, item.problem, item.solution, item.gaps];
    item.concepts.forEach(function (concept) { parts.push(concept.name, concept.use, liveStatus(statuses, concept.name)); });
    return parts.join(' ');
  }

  function conceptSearchText(concept) {
    var parts = [concept.name, concept.status || 'new', concept.verified, concept.words, concept.recall].concat(concept.exampleNotes || []);
    Object.keys(concept.applied || {}).forEach(function (language) { parts.push(language, concept.applied[language]); });
    return parts.join(' ');
  }

  function eventSearchText(event) {
    return [event.date, event.time, event.event, event.concept, event.note, event.language].join(' ');
  }

  function visibleWork(statuses, tokens) {
    var matching = [];
    state.work.forEach(function (item, index) {
      if (understandingFilter && item.understanding !== understandingFilter) return;
      if (kindFilter && item.kind !== kindFilter) return;
      if (containsEveryToken(workSearchText(item, statuses), tokens)) matching.push({ item: item, index: index });
    });
    matching.sort(function (a, b) {
      if (a.item.date === b.item.date) return b.index - a.index;
      return a.item.date < b.item.date ? 1 : -1;
    });
    return matching.map(function (entry) { return entry.item; });
  }

  function understandingChip(level) {
    return el('span', { 'class': 'chip static ' + (UNDERSTANDING_TONES[level] || 'new'), text: level });
  }

  function labelledField(label, text, tokens) {
    return text ? el('div', { 'class': 'field' }, el('b', { text: label + ': ' }), marked(text, tokens)) : null;
  }

  function workConcept(concept, statuses, tokens) {
    var status = liveStatus(statuses, concept.name);
    return el('div', { 'class': 'work-concept', role: 'listitem' },
      el('span', { 'class': 'name' }, marked(concept.name, tokens)),
      el('span', { 'class': 'chip static ' + statusClass(status === 'not in ledger' ? 'new' : status), title: 'Current status in your ledger', text: status }),
      concept.use ? el('div', { 'class': 'detail' }, marked(concept.use, tokens)) : null
    );
  }

  function workKey(item) {
    return 'work:' + item.title + '|' + item.date;
  }

  function conceptKey(concept) {
    return 'concept:' + concept.name;
  }

  function disclosure(key, summaryContent, body) {
    var details = el('details', null,
      el('summary', { onclick: function () { rememberOpen(key, !details.open); } }, summaryContent),
      body
    );
    details.open = openKeys[key] === true;
    return details;
  }

  function rememberOpen(key, isOpen) {
    if (isOpen) openKeys[key] = true;
    else delete openKeys[key];
  }

  function workCard(item, statuses, tokens) {
    var concepts = item.concepts.map(function (concept) { return workConcept(concept, statuses, tokens); });
    var summary = [
      el('h3', { 'class': 'title' }, marked(item.title, tokens)),
      el('div', { 'class': 'chips' },
        el('span', { 'class': 'chip static new', text: item.kind || 'work' }),
        understandingChip(item.understanding),
        el('span', { 'class': 'muted', text: [item.date, item.source].filter(Boolean).join(' · ') }))
    ];
    var body = el('div', { 'class': 'body' },
      labelledField('Problem', item.problem, tokens),
      labelledField('How it was solved', item.solution, tokens),
      concepts.length ? el('div', { role: 'list', 'aria-label': 'Concepts used in ' + item.title }, concepts) : null,
      labelledField('Still unclear', item.gaps, tokens),
      item.understanding === 'skipped'
        ? el('div', { 'class': 'muted', text: 'Skipped on override. To go back to it, ask Claude: "help me understand ' + (item.source || item.title) + '".' })
        : null
    );
    return el('div', { 'class': 'card work', role: 'listitem' }, disclosure(workKey(item), summary, body));
  }

  function conceptMatchCard(concept, tokens) {
    var summary = [
      el('span', { 'class': 'title' }, marked(concept.name, tokens)),
      el('div', { 'class': 'chips' }, el('span', { 'class': 'chip static ' + statusClass(concept.status || 'new'), text: concept.status || 'new' }))
    ];
    var body = el('div', { 'class': 'body' }, conceptFields(concept, tokens), appliedFields(concept, tokens));
    return el('div', { 'class': 'card work', role: 'listitem' }, disclosure(conceptKey(concept), summary, body));
  }

  function conceptFields(concept, tokens) {
    return [
      labelledField('In your words', concept.words, tokens),
      labelledField('Recall question', concept.recall, tokens),
      labelledField('Last verified', concept.verified, tokens),
      labelledField('Studied (does not count toward your level)', concept.study, tokens),
      sourceFields(concept),
      concept.exampleNotes.map(function (note, index) { return exampleBlock(concept, note, index, tokens); })
    ];
  }

  function sourceFields(concept) {
    return concept.sources.map(function (source) {
      var title = source.url ? el('a', { href: source.url, target: '_blank', rel: 'noopener noreferrer', text: source.title }) : source.title;
      var meta = [source.kind, source.checked ? 'checked ' + source.checked : ''].filter(Boolean).join(', ');
      return el('div', { 'class': 'field' }, el('b', { text: 'Source: ' }), title, meta ? ' (' + meta + ')' : '');
    });
  }

  function exampleBlock(concept, note, index, tokens, label) {
    var parts = note.split(' | ');
    var summary = [
      el('span', { 'class': 'exn', text: (label || 'Example ' + (index + 1)) + ': ' }),
      el('span', { 'class': 'ext' }, marked(parts[0], tokens))
    ];
    var snapshot = (concept.exampleCode || [])[index] || null;
    var body = el('div', { 'class': 'exbody' }, parts.slice(1).map(function (part) { return exampleDetail(concept, part, tokens, snapshot); }));
    return el('div', { 'class': 'example-item' }, disclosure('example:' + concept.name + '|' + index, summary, body));
  }

  function exampleDetail(concept, part, tokens, snapshot) {
    var colon = part.indexOf(': ');
    if (colon < 0) return el('div', { 'class': 'example-detail' }, marked(part, tokens));
    var key = part.slice(0, colon);
    var text = part.slice(colon + 2);
    var label = key === 'why' ? 'Why it is ' + concept.name : EXAMPLE_LABELS[key] || key;
    if (key === 'where' && snapshot) return [snapshotBlock(label, snapshot), el('div', { 'class': 'code-caption' }, marked(text, tokens))];
    if (key === 'where') return codeBlock(label, text, tokens);
    return el('div', { 'class': 'example-detail' }, el('b', { text: label + ': ' }), marked(text, tokens));
  }

  function snapshotBlock(label, snapshot) {
    var last = snapshot.start + snapshot.lines.length - 1;
    var range = snapshot.path + ':' + snapshot.start + (last > snapshot.start ? '-' + last : '');
    var code = snapshot.lines.map(function (line) { return line.text; }).join('\n');
    return el('div', { 'class': 'code' },
      el('div', { 'class': 'code-head' }, el('span', { text: label + ' · ' + range }), copyButton(code, 'Copy code')),
      el('div', { 'class': 'code-lines' }, snapshot.lines.map(function (line, index) { return snapshotLine(line, snapshot.start + index); }))
    );
  }

  function snapshotLine(line, number) {
    return el('div', { 'class': 'code-line' + (line.highlight ? ' hl' : '') },
      el('span', { 'class': 'ln', text: String(number) }),
      el('span', { 'class': 'ct', text: line.text })
    );
  }

  function codeBlock(label, locations, tokens) {
    var lines = locations.split('; ').map(function (line) { return line.trim(); }).filter(Boolean);
    return el('div', { 'class': 'code' },
      el('div', { 'class': 'code-head' }, el('span', { text: label }), copyButton(lines.join('\n'))),
      el('pre', null, el('code', null, lines.map(function (line, index) { return [index ? '\n' : '', codeLine(line, tokens)]; })))
    );
  }

  function codeLine(line, tokens) {
    return line.split(CODE_REFERENCE).map(function (piece, index) {
      if (index % 2 === 0) return marked(piece, tokens);
      return el('span', { 'class': piece.indexOf('/') === -1 ? 's' : 'p' }, marked(piece, tokens));
    });
  }

  function copyButton(text, ariaLabel) {
    var button = el('button', { type: 'button', 'class': 'copy', 'aria-label': ariaLabel || 'Copy code locations', onclick: function () { copyText(button, text); } }, 'Copy');
    return button;
  }

  function copyText(button, text) {
    var finish = function (label) {
      button.textContent = label;
      setTimeout(function () { button.textContent = 'Copy'; }, 1600);
    };
    if (!navigator.clipboard) { finish('Select the text'); return; }
    navigator.clipboard.writeText(text).then(function () { finish('Copied'); }, function () { finish('Select the text'); });
  }

  function appliedFields(concept, tokens) {
    return Object.keys(concept.applied).map(function (language) { return labelledField('Applied in ' + language, concept.applied[language], tokens); });
  }

  function eventMatchRow(event, tokens) {
    var detail = [event.concept, event.note, event.language].filter(Boolean).join(' · ');
    return el('div', { 'class': 'event', role: 'listitem' },
      el('div', { 'class': 'when', text: [event.date, event.time].filter(Boolean).join(' ') }),
      el('div', { 'class': 'what' }, el('b', null, marked(event.event || '', tokens)), detail ? ' · ' : '', marked(detail, tokens))
    );
  }

  function recentFilterGroup(label, values, current, choose) {
    var chips = values.map(function (value) {
      var isActive = current === value;
      return el('button', { type: 'button', 'class': isActive ? 'chip active' : 'chip', 'aria-pressed': isActive ? 'true' : 'false', onclick: function () { choose(isActive ? '' : value); }, text: value });
    });
    return el('div', { 'class': 'group', role: 'group', 'aria-label': label }, el('span', { 'class': 'label', text: label }), chips);
  }

  function clearRecentFilters() {
    recentQuery = '';
    understandingFilter = '';
    kindFilter = '';
    recentParts.input.value = '';
    renderRecent(true);
  }

  function searchEverything(statuses, tokens) {
    var isSearching = tokens.length > 0;
    return {
      isSearching: isSearching,
      work: visibleWork(statuses, tokens),
      concepts: isSearching ? state.concepts.filter(function (concept) { return containsEveryToken(conceptSearchText(concept), tokens); }) : [],
      events: isSearching ? state.events.filter(function (event) { return containsEveryToken(eventSearchText(event), tokens); }) : []
    };
  }

  function keysOfEverythingShown(found) {
    var keys = {};
    found.work.forEach(function (item) { keys[workKey(item)] = true; });
    found.concepts.forEach(function (concept) { keys[conceptKey(concept)] = true; });
    return keys;
  }

  function expandAll() {
    openKeys = keysOfEverythingShown(searchEverything(conceptStatusByName(), queryTokens()));
    renderRecent(true);
  }

  function collapseAll() {
    openKeys = {};
    renderRecent(true);
  }

  function resultSection(heading, label, rows, isHeadingShown) {
    if (!rows.length) return null;
    return [
      isHeadingShown ? el('h2', { text: heading + ' (' + rows.length + ')' }) : null,
      el('div', { 'class': 'results', role: 'list', 'aria-label': label }, rows)
    ];
  }

  function resultSections(found, statuses, tokens) {
    var shownEvents = found.events.slice(0, EVENT_MATCHES_SHOWN);
    return [
      resultSection('Work', 'Recent work', found.work.map(function (item) { return workCard(item, statuses, tokens); }), found.isSearching),
      resultSection('Concepts', 'Matching concepts', found.concepts.map(function (concept) { return conceptMatchCard(concept, tokens); }), true),
      resultSection('Activity', 'Matching activity', shownEvents.map(function (event) { return eventMatchRow(event, tokens); }), true),
      found.events.length > shownEvents.length ? el('div', { 'class': 'muted', text: 'Showing the newest ' + shownEvents.length + ' of ' + found.events.length + ' matching events. Add a word to narrow it.' }) : null
    ];
  }

  function buildRecentControls(root) {
    var input = el('input', { id: 'recent-search', type: 'search', placeholder: 'Search everything: the work, concepts, examples, in your words, activity', 'aria-label': 'Search recent work' });
    input.addEventListener('input', function () { recentQuery = input.value; renderRecent(false); });
    var parts = { input: input, filters: el('div', { 'class': 'results' }), summary: el('div', { 'class': 'controls' }), results: el('div', { 'class': 'results' }) };
    replaceChildren(root, [
      el('div', { 'class': 'card' }, el('h2', { text: 'Recent work' }), input, parts.filters, parts.summary),
      parts.results
    ]);
    return parts;
  }

  function renderRecent(isForced) {
    var root = document.getElementById('recent');
    var statuses = conceptStatusByName();
    if (!recentParts) recentParts = buildRecentControls(root);
    var key = JSON.stringify([state.work, state.concepts, state.events, recentQuery, understandingFilter, kindFilter]);
    if (!isForced && key === shownRecent) return;
    shownRecent = key;
    var tokens = queryTokens();
    var found = searchEverything(statuses, tokens);
    if (recentQuery !== queryThatOpenedCards) {
      queryThatOpenedCards = recentQuery;
      openKeys = found.isSearching ? keysOfEverythingShown(found) : {};
    }
    var shown = found.work;
    var isFiltered = recentQuery.trim() !== '' || understandingFilter !== '' || kindFilter !== '';
    replaceChildren(recentParts.filters, [
      recentFilterGroup('Understanding', UNDERSTANDING_LEVELS, understandingFilter, function (value) { understandingFilter = value; renderRecent(true); }),
      recentFilterGroup('Kind', WORK_KINDS, kindFilter, function (value) { kindFilter = value; renderRecent(true); })
    ]);
    replaceChildren(recentParts.summary, [
      el('span', { 'class': 'muted', role: 'status', text: 'Showing ' + shown.length + ' of ' + state.work.length }),
      hasCards(found) ? el('button', { type: 'button', onclick: expandAll }, 'Expand all') : null,
      hasCards(found) ? el('button', { type: 'button', onclick: collapseAll }, 'Collapse all') : null,
      isFiltered ? el('button', { type: 'button', onclick: clearRecentFilters }, 'Clear search and filters') : null
    ]);
    var isEmpty = !shown.length && !found.concepts.length && !found.events.length;
    replaceChildren(recentParts.results, isEmpty ? [el('div', { 'class': 'card muted', text: emptyMessage() })] : resultSections(found, statuses, tokens));
  }

  function hasCards(found) {
    return found.work.length > 0 || found.concepts.length > 0;
  }

  function emptyMessage() {
    return state.work.length === 0 && queryTokens().length === 0
      ? 'No work recorded yet. Claude adds an entry when a piece of work or a walkthrough ends.'
      : 'Nothing matches. Try fewer words, or clear the filters.';
  }

  function languageSwitcher(active) {
    var buttons = state.dial.map(function (entry) {
      var isActive = entry.language === active;
      return el('button', {
        type: 'button',
        'class': isActive ? 'tab active' : 'tab',
        'aria-pressed': isActive ? 'true' : 'false',
        onclick: function () { setSelectedLanguage(entry.language); },
        text: entry.language + (entry.language === state.language ? ' (primary)' : '')
      });
    });
    return el('div', { 'class': 'card' },
      el('h2', { text: 'Language' }),
      el('div', { 'class': 'tabs', role: 'group', 'aria-label': 'Language' }, buttons),
      el('div', { 'class': 'muted', text: 'Switching language changes only this screen. Your stage and concepts stay the same.' })
    );
  }

  function dialCard(entry) {
    var steps = RUNG_NAMES.map(function (name, index) {
      var rung = index + 1;
      var tone = (rung <= entry.rung ? 'done' : '') + (rung === entry.rung ? ' current' : '');
      return el('li', { 'class': tone.trim() }, el('span', { 'class': 'bar' }), el('span', { text: rung + '. ' + name }));
    });
    return el('div', { 'class': 'card' },
      el('h2', { text: entry.language + ' code dial' }),
      el('div', { 'class': 'big', text: 'Rung ' + entry.rung + ' of ' + RUNG_NAMES.length }),
      el('ol', { 'class': 'rungs' }, steps),
      el('div', { 'class': 'muted', text: 'You write ' + RUNG_NAMES[entry.rung - 1] + ' at a time in ' + entry.language + '. Clean streak: ' + entry.streak + '.' })
    );
  }

  function examplesInLanguage(concept, language) {
    var items = concept.exampleNotes
      .map(function (note, index) { return { note: note, index: index }; })
      .filter(function (example) { return (concept.exampleLanguages[example.index] || '').toLowerCase() === language.toLowerCase(); })
      .map(function (example) { return exampleBlock(concept, example.note, example.index, []); });
    return items.length ? el('div', { 'class': 'language-examples' }, items) : null;
  }

  function appliedCard(language) {
    var applied = state.concepts.filter(function (concept) { return concept.applied[language]; }).length;
    var rows = state.concepts.map(function (concept) {
      var note = concept.applied[language];
      return el('div', { 'class': 'row', role: 'listitem' },
        el('div', { 'class': 'name', text: concept.name }),
        el('span', { 'class': 'chip static ' + statusClass(concept.status || 'new'), text: concept.status || 'new' }),
        el('div', { 'class': note ? 'detail' : 'detail none', text: note || 'Not applied in ' + language + ' yet.' }),
        examplesInLanguage(concept, language)
      );
    });
    return el('div', { 'class': 'card' },
      el('h2', { text: 'Concepts in ' + language + ' (' + applied + ' of ' + state.concepts.length + ' applied)' }),
      rows.length ? el('div', { role: 'list', 'aria-label': 'Concepts in ' + language }, rows) : el('div', { 'class': 'muted', text: 'No concepts yet.' })
    );
  }

  function languageEventsCard(language) {
    var rows = state.events.filter(function (event) { return event.language === language; }).slice(0, 10).map(function (event) {
      return el('div', { 'class': 'event', role: 'listitem' },
        el('div', { 'class': 'when', text: (event.date || '').slice(5) + ' ' + (event.time || '') }),
        el('div', { 'class': 'what' }, el('b', { text: event.event || '' }), event.note ? ' · ' + event.note : '')
      );
    });
    return el('div', { 'class': 'card' },
      el('h2', { text: 'Recent in ' + language }),
      rows.length ? el('div', { role: 'list', 'aria-label': 'Recent in ' + language }, rows) : el('div', { 'class': 'muted', text: 'Nothing logged for ' + language + ' yet.' })
    );
  }

  function renderLanguages() {
    var root = document.getElementById('languages');
    var active = state.hasLedger ? activeLanguage() : '';
    var entry = state.dial.filter(function (candidate) { return candidate.language === active; })[0];
    var key = JSON.stringify([state.hasLedger, active, state.language, state.dial, state.concepts, state.events.filter(function (event) { return event.language === active; })]);
    if (key === shownLanguages) return;
    shownLanguages = key;
    if (!state.hasLedger || !entry) {
      replaceChildren(root, [el('div', { 'class': 'card' }, el('div', { text: state.hasLedger ? 'No languages yet. Add one in Settings.' : 'No ledger yet. The first understand-first session creates it.' }))]);
      return;
    }
    replaceChildren(root, [languageSwitcher(active), dialCard(entry), appliedCard(active), languageEventsCard(active)]);
  }

  function stageSettings() {
    var lower = [];
    for (var stage = 1; stage < state.stage; stage++) lower.push(el('option', { value: String(stage), text: 'Stage ' + stage }));
    var picker = el('select', { id: 'stage-picker', 'aria-label': 'Choose a lower stage' }, lower);
    return el('div', { 'class': 'card' },
      el('h2', { text: 'Stage' }),
      el('div', { text: 'Stage ' + state.stage + ' of ' + state.stageCount + ', since ' + (state.stageSince || 'unknown') + '. Moving up happens on its own.' }),
      state.stage > 1
        ? el('div', { 'class': 'controls' },
            el('button', { onclick: function () { post({ action: 'stage-down' }); } }, 'Go back one stage'),
            picker,
            el('button', { onclick: function () { post({ action: 'stage-down', to: Number(picker.value) }); } }, 'Go to that stage'))
        : el('div', { 'class': 'muted', text: 'You are at stage 1.' })
    );
  }

  function languageSettings() {
    var rows = state.dial.map(function (entry) {
      return el('div', { 'class': 'row' },
        el('div', { 'class': 'name', text: entry.language + (entry.language === state.language ? ' (primary)' : '') }),
        el('div', { 'class': 'controls' },
          el('span', { 'class': 'muted', text: 'rung ' + entry.rung + ' of ' + RUNGS }),
          el('button', { disabled: entry.rung <= 1 ? 'disabled' : null, onclick: function () { post({ action: 'dial-down', language: entry.language }); } }, 'Lower a rung'),
          entry.language === state.language ? null : el('button', { onclick: function () { post({ action: 'set-language', language: entry.language }); } }, 'Make primary'))
      );
    });
    var input = el('input', { id: 'new-language', type: 'text', placeholder: 'Add a language', maxlength: '40', 'aria-label': 'Language to add' });
    return el('div', { 'class': 'card' },
      el('h2', { text: 'Language and code dial' }),
      rows.length ? el('div', null, rows) : el('div', { 'class': 'muted', text: 'No languages yet.' }),
      el('div', { 'class': 'controls' }, input,
        el('button', { onclick: function () { post({ action: 'add-language', language: input.value }).then(function () { input.value = ''; }); } }, 'Add at rung 1'))
    );
  }

  function modeSettings() {
    return el('div', { 'class': 'card' },
      el('h2', { text: 'Stats mode' }),
      el('div', { text: 'Stats mode is ' + state.statsMode + '.' }),
      state.statsMode === 'dashboard'
        ? el('div', { 'class': 'controls' }, el('button', { onclick: function () { post({ action: 'stats-mode-terminal' }); } }, 'Turn hosted dashboard publishing off'))
        : el('div', { 'class': 'muted', text: 'This page shows your stats locally. Publishing to a hosted page is opt-in: run /understand-first:menu mode dashboard in Claude Code.' })
    );
  }

  function resetControls(container) {
    replaceChildren(container, [el('button', { 'class': 'danger', onclick: function () { askToConfirmReset(container); } }, 'Reset to stage 1')]);
  }

  function askToConfirmReset(container) {
    replaceChildren(container, [
      el('span', { text: 'Reset to stage 1? Your concepts and code dial stay.' }),
      el('button', { 'class': 'danger', onclick: function () { post({ action: 'reset-stage', confirm: true }); } }, 'Yes, reset'),
      el('button', { onclick: function () { resetControls(container); } }, 'Cancel')
    ]);
  }

  function skipSettings() {
    return el('div', { 'class': 'card' },
      el('h2', { text: 'Skip the gates' }),
      el('div', { 'class': 'muted', text: 'The next task runs without understanding gates. Nothing is deleted.' }),
      el('div', { 'class': 'controls' }, el('button', { onclick: function () { post({ action: 'skip-gates' }); } }, 'Skip the gates for the next task'))
    );
  }

  function resetSettings() {
    var resetBox = el('div', { 'class': 'controls' });
    resetControls(resetBox);
    return el('div', { 'class': 'card danger-zone' },
      el('h2', { text: 'Reset' }),
      el('div', { 'class': 'muted', text: 'Your stage goes back to 1 and the gates start from the beginning. Your concepts, code dial and history stay.' }),
      resetBox
    );
  }

  function renderSettings() {
    var key = JSON.stringify([state.hasLedger, state.stage, state.stageSince, state.language, state.statsMode, state.dial, state.storage]);
    if (key === shownSettings) return;
    shownSettings = key;
    var root = document.getElementById('settings');
    if (!state.hasLedger) {
      replaceChildren(root, [storageSettings(), el('div', { 'class': 'card' }, el('div', { text: 'No ledger yet. The first understand-first session creates it.' }))]);
      return;
    }
    replaceChildren(root, [storageSettings(), stageSettings(), languageSettings(), modeSettings(), skipSettings(), resetSettings()]);
  }

  function renderDocs() {
    var root = document.getElementById('docs');
    if (root.firstChild) return;
    replaceChildren(root, DOCS.map(docsTopic));
  }

  function docsTopic(topic) {
    return el('div', { 'class': 'card' },
      el('h2', { text: topic.title }),
      el('ul', null, topic.points.map(docsPoint))
    );
  }

  function docsPoint(point) {
    return el('li', null, el('code', { text: point[0] }), ' ' + point[1]);
  }

  function backendNamed(name) {
    return state.storage.backends.filter(function (backend) { return backend.name === name; })[0];
  }

  function storageField(setting, value) {
    var id = 'storage-setting-' + setting.key;
    return el('div', { 'class': 'controls' },
      el('label', { 'for': id, text: setting.label }),
      el('input', { id: id, name: setting.key, type: 'text', value: value, size: '44', autocomplete: 'off', spellcheck: 'false' })
    );
  }

  function enteredStorageSettings(backend) {
    var values = {};
    backend.settings.forEach(function (setting) { values[setting.key] = document.getElementById('storage-setting-' + setting.key).value; });
    return values;
  }

  function storageSummary(configured) {
    return configured
      ? 'Your data is copied to ' + configured.backend + ' and brought back on a new computer.'
      : 'Your data is only on this computer. If it is lost, so is your history.';
  }

  function storageNotices(storage) {
    var notices = Object.keys(storage.failures).map(function (name) {
      return el('div', { 'class': 'muted', text: 'Could not load the "' + name + '" backend: ' + storage.failures[name] });
    });
    if (storage.lastError) notices.push(el('div', { 'class': 'muted', text: 'Last sync problem: ' + storage.lastError }));
    return notices;
  }

  function storageFields(backend, configured) {
    var saved = configured && configured.backend === backend.name ? configured.settings : {};
    return backend.settings.map(function (setting) {
      return storageField(setting, saved[setting.key] !== undefined ? saved[setting.key] : setting.default);
    });
  }

  function backendPicker(storage) {
    var picker = el('select', { id: 'storage-backend', 'aria-label': 'Storage backend' },
      storage.backends.map(function (backend) { return el('option', { value: backend.name, text: backend.name }); }));
    picker.value = storage.configured ? storage.configured.backend : storage.backends[0].name;
    return picker;
  }

  function postWhileBusy(button, busyLabel, body) {
    var label = button.textContent;
    button.disabled = true;
    button.textContent = busyLabel;
    return post(body).then(function () { button.disabled = false; button.textContent = label; });
  }

  function storageButtons(picker, configured) {
    var save = el('button', {
      onclick: function (event) {
        postWhileBusy(event.currentTarget, 'Saving…', { action: 'storage-configure', backend: picker.value, settings: enteredStorageSettings(backendNamed(picker.value)) });
      }
    }, configured ? 'Save changes' : 'Save and use');
    var syncNow = configured ? el('button', {
      onclick: function (event) { postWhileBusy(event.currentTarget, 'Syncing…', { action: 'storage-sync-now' }); }
    }, 'Sync now') : null;
    var stop = configured ? el('button', { onclick: function () { post({ action: 'storage-disable' }); } }, 'Use local storage only') : null;
    return el('div', { 'class': 'controls' }, save, syncNow, stop);
  }

  function storageSettings() {
    var storage = state.storage;
    var heading = el('h2', { text: 'Storage' });
    var summary = el('div', { id: 'storage-summary', text: storageSummary(storage.configured) });
    if (!storage.backends.length) return el('div', { 'class': 'card', id: 'storage' }, heading, summary, storageNotices(storage));
    var picker = backendPicker(storage);
    var fields = el('div');
    function showFields() { replaceChildren(fields, storageFields(backendNamed(picker.value), storage.configured)); }
    picker.addEventListener('change', showFields);
    showFields();
    return el('div', { 'class': 'card', id: 'storage' },
      heading,
      summary,
      el('div', { 'class': 'controls' }, el('label', { 'for': 'storage-backend', text: 'Backend' }), picker),
      fields,
      storageButtons(picker, storage.configured),
      storageNotices(storage)
    );
  }

  function referencesIn(text) {
    return Array.from(text.matchAll(/(PR|ticket|TFS)\s*(\d{5,7})/gi)).map(function (match) {
      var kind = match[1].toUpperCase() === 'TICKET' ? 'Ticket' : match[1].toUpperCase();
      return { id: match[2], label: kind + ' ' + match[2] };
    });
  }

  function exampleTitle(note) {
    return note.split(' | ')[0];
  }

  function examplesTiedTo(item) {
    var workIds = {};
    referencesIn(item.title + ' ' + item.source).forEach(function (reference) { workIds[reference.id] = true; });
    var hasIds = Object.keys(workIds).length > 0;
    var skills = item.concepts.map(function (concept) { return concept.name; });
    var tied = [];
    state.concepts.forEach(function (concept) {
      concept.exampleNotes.forEach(function (note, index) {
        var title = exampleTitle(note);
        var ids = referencesIn(title);
        var sharesId = ids.some(function (reference) { return workIds[reference.id]; });
        var sameProject = !hasIds && ids.length === 0 && title.indexOf('understand-first') !== -1 && skills.indexOf(concept.name) !== -1;
        if (sharesId || sameProject) tied.push({ concept: concept, note: note, index: index });
      });
    });
    return tied;
  }

  function referencesOf(item, tied) {
    var seen = {};
    var labels = [];
    [item.title, item.source].concat(tied.map(function (example) { return exampleTitle(example.note); })).forEach(function (text) {
      referencesIn(text).forEach(function (reference) {
        if (seen[reference.label]) return;
        seen[reference.label] = true;
        labels.push(reference.label);
      });
    });
    return labels;
  }

  function buildProjects() {
    return state.work.map(function (item, index) {
      var tied = examplesTiedTo(item);
      return { item: item, index: index, tied: tied, references: referencesOf(item, tied) };
    }).sort(function (a, b) {
      if (a.item.date === b.item.date) return b.index - a.index;
      return a.item.date < b.item.date ? 1 : -1;
    });
  }

  function projectSearchText(project) {
    var item = project.item;
    var parts = [item.title, item.kind, item.understanding, item.date, item.source, item.problem, item.solution, item.gaps, project.references.join(' ')];
    item.concepts.forEach(function (concept) { parts.push(concept.name, concept.use); });
    project.tied.forEach(function (example) { parts.push(example.note); });
    return parts.join(' ');
  }

  function matchingProjects(projects) {
    var tokens = projectQuery.toLowerCase().split(/\s+/).filter(Boolean);
    return projects.filter(function (project) {
      if (projectUnderstanding && project.item.understanding !== projectUnderstanding) return false;
      if (projectKind && project.item.kind !== projectKind) return false;
      return containsEveryToken(projectSearchText(project), tokens);
    });
  }

  function projectListItem(project, isSelected) {
    var item = project.item;
    return el('button', {
      type: 'button',
      'class': 'project-item',
      'aria-current': isSelected ? 'true' : 'false',
      onclick: function () { selectedProjectKey = workKey(item); renderProjects(true); }
    },
      el('span', { 'class': 'title', text: item.title }),
      el('span', { 'class': 'chips' }, el('span', { 'class': 'chip static new', text: item.kind || 'work' }), understandingChip(item.understanding), el('span', { 'class': 'muted', text: item.date })),
      project.references.length ? el('span', { 'class': 'refs', text: project.references.join(' · ') }) : null
    );
  }

  function levelMeter(status) {
    var rank = { 'learning': 1, 'getting it': 2, 'solid': 3 }[status] || 0;
    return el('span', { 'class': 'meter', 'aria-hidden': 'true' }, [1, 2, 3].map(function (step) { return el('i', { 'class': step <= rank ? 'on ' + statusClass(status) : '' }); }));
  }

  function skillRow(concept, statuses) {
    var status = liveStatus(statuses, concept.name);
    return el('div', { 'class': 'skill-row', role: 'listitem' },
      el('b', { text: concept.name }),
      el('span', { 'class': 'level' }, levelMeter(status), el('span', { 'class': 'chip static ' + statusClass(status === 'not in ledger' ? 'new' : status), title: 'Current status in your ledger', text: status })),
      el('span', { text: concept.use || '' })
    );
  }

  function projectDetail(project, statuses) {
    var item = project.item;
    var skills = item.concepts.map(function (concept) { return skillRow(concept, statuses); });
    var decisions = project.tied.map(function (example) { return exampleBlock(example.concept, example.note, example.index, [], example.concept.name); });
    return el('div', { 'class': 'project-detail' },
      el('div', { 'class': 'card' },
        el('h1', { text: item.title }),
        el('div', { 'class': 'chips' }, el('span', { 'class': 'chip static new', text: item.kind || 'work' }), understandingChip(item.understanding), el('span', { 'class': 'muted', text: [item.date, item.source].filter(Boolean).join(' · ') })),
        project.references.length ? el('div', { 'class': 'chips' }, project.references.map(function (label) { return el('span', { 'class': 'ref', text: label }); })) : null,
        el('div', { 'class': 'two-up' },
          el('div', null, el('h3', { text: 'Problem' }), el('p', { text: item.problem || 'Not recorded.' })),
          el('div', null, el('h3', { text: 'What we did' }), el('p', { text: item.solution || 'Not recorded.' })))),
      el('div', { 'class': 'card' },
        el('h3', { text: 'Skills used and where you stand' }),
        skills.length ? el('div', { role: 'list', 'aria-label': 'Skills used' }, skills) : el('div', { 'class': 'muted', text: 'No skills recorded for this work.' })),
      el('div', { 'class': 'card' },
        el('h3', { text: 'Decisions and why (' + decisions.length + ')' }),
        decisions.length ? el('div', { 'class': 'body' }, decisions) : el('div', { 'class': 'muted', text: 'No examples are tied to this work yet.' })),
      el('div', { 'class': 'card' },
        el('h3', { text: 'Tradeoffs' }),
        el('div', { 'class': 'not-recorded', text: 'Not recorded yet. A work entry has no tradeoffs line today. The reasons under Decisions and why are the closest record.' })),
      item.gaps ? el('div', { 'class': 'card' }, el('h3', { text: 'Still unclear' }), el('p', { text: item.gaps })) : null
    );
  }

  function buildProjectControls(root) {
    var input = el('input', { id: 'project-search', type: 'search', placeholder: 'Find a PR, ticket or project', 'aria-label': 'Find a project' });
    input.addEventListener('input', function () { projectQuery = input.value; renderProjects(false); });
    var parts = { input: input, filters: el('div', { 'class': 'results' }), count: el('div', { 'class': 'muted', role: 'status' }), list: el('div', { 'class': 'project-list' }), detail: el('div') };
    replaceChildren(root, [
      el('div', { 'class': 'project-column' },
        el('div', { 'class': 'card' }, el('h2', { text: 'Projects' }), input, parts.filters),
        parts.count,
        parts.list),
      parts.detail
    ]);
    return parts;
  }

  function renderProjects(isForced) {
    var root = document.getElementById('projects');
    if (!projectParts) projectParts = buildProjectControls(root);
    var key = JSON.stringify([state.work, state.concepts, projectQuery, projectUnderstanding, projectKind, selectedProjectKey]);
    if (!isForced && key === shownProjects) return;
    shownProjects = key;
    var statuses = conceptStatusByName();
    var projects = buildProjects();
    var shown = matchingProjects(projects);
    var selected = shown.filter(function (project) { return workKey(project.item) === selectedProjectKey; })[0] || shown[0];
    replaceChildren(projectParts.filters, [
      recentFilterGroup('Understanding', UNDERSTANDING_LEVELS, projectUnderstanding, function (value) { projectUnderstanding = value; renderProjects(true); }),
      recentFilterGroup('Kind', WORK_KINDS, projectKind, function (value) { projectKind = value; renderProjects(true); })
    ]);
    projectParts.count.textContent = shown.length + ' of ' + projects.length + ' projects shown';
    replaceChildren(projectParts.list, shown.length
      ? shown.map(function (project) { return projectListItem(project, project === selected); })
      : [el('div', { 'class': 'card muted', text: 'Nothing matches. Try fewer words, or clear the filters.' })]);
    replaceChildren(projectParts.detail, [selected
      ? projectDetail(selected, statuses)
      : el('div', { 'class': 'card muted', text: state.work.length ? 'Pick a project on the left to see its overview.' : 'No projects yet. Claude adds one when a piece of work or a walkthrough ends.' })]);
  }

  function render(isForced) {
    if (!state) return;
    if (isForced) { shownStats = ''; shownLanguages = ''; shownSettings = ''; shownRecent = ''; shownProjects = ''; }
    renderStats();
    renderRecent(false);
    renderProjects(false);
    renderLanguages();
    renderSettings();
    renderDocs();
  }

  function refresh() {
    if (document.hidden) return;
    fetch('/api/state', { cache: 'no-store' }).then(function (response) { return response.json(); }).then(function (next) {
      if (state && next.version !== state.version) {
        location.reload();
        return;
      }
      state = next;
      setConnection(true);
      render(false);
    }).catch(function () { setConnection(false); });
  }

  window.addEventListener('hashchange', showScreen);
  document.addEventListener('visibilitychange', refresh);
  showScreen();
  refresh();
  setInterval(refresh, POLL_MS);
})();
